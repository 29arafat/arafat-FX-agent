# ============================================================
# config.yaml: সব সংখ্যা এখানে, কোডে নয়।
# "প্রাথমিক অনুমান" লেখা মানগুলো ধাপ ৩-এর ব্যাকটেস্টে ঠিক হবে।
# এখানে কোনো Token বা Key লিখবেন না (সেগুলো GitHub Secrets-এ)।
# ============================================================

data:
  provider: twelvedata        # প্রোভাইডার, পেয়ারভিত্তিক বদলানো যায়
  timezone: UTC               # আবশ্যিক: ডিফল্ট UTC+11, তাই সবসময় UTC পাঠাব
  h1_bars: 3500               # প্রতি ঘণ্টায় আনা H1 (সপ্তাহান্ত বাদে ~২৪৯০ ঘণ্টা → ~৬২০ H4)
  d1_h1_bars: 9000            # D1 বানানোর ঘণ্টায় আনা H1 (সপ্তাহান্ত বাদে ~২৬৫ D1), ২ পেজ
  drop_flat_candles: true     # শূন্য-রেঞ্জ ক্যান্ডেল বাদ
  drop_weekend_candles: true  # সপ্তাহান্ত জানালার ক্যান্ডেল বাদ (প্রোভাইডার সপ্তাহান্তেও ক্যান্ডেল দেয়)
  weekend:                    # বাজার বন্ধের জানালা (UTC, সপ্তাহ সোমবার=০ থেকে)
    close: {weekday: 4, hour: 22}   # শুক্র ২২:০০ থেকে
    open: {weekday: 6, hour: 22}    # রবি ২২:০০ পর্যন্ত (এই ঘণ্টার ক্যান্ডেল থেকে আবার ধরা)
  drop_running_candle: true   # চলমান ক্যান্ডেল বাদ (repainting রোধ)
  d1_day_start_hour: 20       # UTC ঘণ্টা। আপনার চার্ট ~২১:০০ (নিউ ইয়র্ক ৫টা); ২০ সবচেয়ে কাছের, ১ ঘণ্টার ফারাক গ্রহণযোগ্য
  d1_min_h1_bars: 3           # এর কম H1 ক্যান্ডেলের "টুকরো দিন" (সপ্তাহান্ত) পাশের দিনে জোড়া লাগে
  min_bars: {H1: 250, H4: 250, D1: 250}   # এর কম ক্যান্ডেল এলে ডেটা অসম্পূর্ণ ধরে সিগন্যাল বন্ধ
  retries: 3
  request_timeout_seconds: 20

api_limits:                   # Twelve Data ফ্রি (২০২৬-১০-২৩ যাচাই)
  credits_per_minute: 8
  credits_per_day: 800
  sleep_between_requests_seconds: 8

pairs:                        # সিদ্ধান্ত (ধাপ ৩খ): এখন শুধু XAUUSD; ফরেক্স পরে আলাদা কৌশলে
  XAUUSD: {symbol: "XAU/USD", decimals: 2, enabled: true}
  EURUSD: {symbol: "EUR/USD", decimals: 5, enabled: false}
  GBPUSD: {symbol: "GBP/USD", decimals: 5, enabled: false}
  USDJPY: {symbol: "USD/JPY", decimals: 3, enabled: false}
  AUDUSD: {symbol: "AUD/USD", decimals: 5, enabled: false}
  USDCAD: {symbol: "USD/CAD", decimals: 5, enabled: false}

timeframes: [H1, H4, D1]      # প্রতিটির স্বতন্ত্র সিগন্যাল

indicators:
  ema_fast: 20
  ema_mid: 50
  ema_slow: 200
  rsi_period: 14
  atr_period: 14

trend:
  ema_gap_min_atr: 0.3        # EMA50 ও EMA200 ফারাক < এই ভগ্নাংশ × ATR হলে "অস্পষ্ট" (প্রাথমিক অনুমান)

scoring:                      # প্রাথমিক অনুমান, ধাপ ৩-এ ঠিক হবে
  weights:
    clear_trend: 2
    pullback_zone: 2
    confirmation: 2
    rsi_state: 1
    no_opposing_level: 1
  required: [clear_trend, pullback_zone]   # বাধ্যতামূলক (v1: কনফার্মেশন ঐচ্ছিক, থাকলে স্কোর বেশি = "কনফার্মড")
  threshold: 4                # স্কোর ≥ এই সংখ্যা (clear_trend ২ + pullback_zone ২ = ৪)

strategy:                     # সবই প্রাথমিক খসড়া। ব্যাকটেস্ট দেখে ভালো দেখানোর জন্য টিউন করা হবে না
  version: "v1-experimental"   # প্রতিটি সিগন্যালে লেখা হয়; ২০-৩০ সিগন্যালের আগে নিয়ম বদলাব না
  confirmed_min_score: 6      # স্কোর ≥ এটা হলে বার্তায় "কনফার্মড"
  tf_map:                     # কোন সিগন্যাল-টাইমফ্রেমে কোন ফ্রেম কী কাজে লাগে
    H1: {trend: D1, setup: H4, trigger: H1}
    H4: {trend: D1, setup: H4, trigger: H4}
    D1: {trend: D1, setup: D1, trigger: D1}
  pullback_lookback: 6        # সেটআপ ফ্রেমের শেষ কত ক্যান্ডেলে EMA20 ছোঁয়া খোঁজা
  zone_break_close: true      # কোনো ক্যান্ডেল EMA50-এর ওপারে ক্লোজ করলে জোন বাতিল
  rsi_dip_lookback: 3         # RSI ডিপ খোঁজার ক্যান্ডেল সংখ্যা
  rsi_dip_level: 50           # BUY-তে RSI এর নিচে নেমে আবার উঠলে কনফার্মেশন (SELL-এ ১০০ − এটি)
  rsi_buy_range: [40, 65]     # "rsi_state" শর্ত (SELL-এ আয়না)
  sl_buffer_atr: 0.1          # সুইং প্রান্তের বাইরে বাফার (ATR ভগ্নাংশ)
  max_sl_atr: 4.0             # SL এর চেয়ে দূরে হলে সিগন্যাল বাদ
  sr:
    swing_k: 3                # সুইং চিহ্নিত করতে দুই পাশে কত ক্যান্ডেল
    lookback: 120             # সাপোর্ট/রেজিস্ট্যান্স খুঁজতে সেটআপ ফ্রেমের কত ক্যান্ডেল পেছনে

risk:
  swing_lookback: 10          # সুইং হাই/লো খুঁজতে কত ক্যান্ডেল পেছনে
  sl_atr_multiplier: 1.5
  rr_default: 2               # কাছে বড় লেভেল থাকলে ১:২
  rr_clear_path: 3            # পথ ফাঁকা থাকলে ১:৩
  entry_valid_atr_fraction: 0.25

rules:
  max_running_per_pair_timeframe: 1
  cooldown_candles: {H1: 4, H4: 2, D1: 1}   # TP/SL হিটের পর অপেক্ষা (নিজ টাইমফ্রেমের ক্যান্ডেল)
  friday_cutoff_utc: "18:00"  # শুক্রবার এর পর নতুন সিগন্যাল নয়
  tracking_timeframe: H1      # সব সিগন্যাল H1 ক্যান্ডেলে ট্র্যাক হবে
  ambiguous_rule: SL          # একই ক্যান্ডেলে দুটোই ছুঁলে SL
  max_signal_age_minutes: {H1: 90, H4: 150, D1: 240}   # এর চেয়ে পুরনো ক্যান্ডেলে নতুন সিগন্যাল পাঠানো হয় না (দেরিতে এন্ট্রি এড়াতে)

backtest:
  oos_fraction: 0.3           # শেষ ৩০% ডেটা শুধু যাচাইয়ের জন্য, টিউনিংয়ে নয়
  spread:                     # প্রাথমিক অনুমান, ধাপ ৩-এ আপনার Exness স্প্রেড বসবে
    XAUUSD: 0.30
    EURUSD: 0.00010
    GBPUSD: 0.00012
    USDJPY: 0.012
    AUDUSD: 0.00012
    USDCAD: 0.00015
  min_trades_for_confidence: 30
  years: 3                    # কত বছরের H1 ইতিহাস আনার চেষ্টা (প্রোভাইডারে না থাকলে যতটা আছে)
  page_bars: 5000
  max_pages: 12
  warmup_bars: 300            # প্রতিটি ফ্রেমের শুরুর এতগুলো ক্যান্ডেলে ইন্ডিকেটর অস্থির, সিগন্যাল নয়

notify:
  telegram_enabled: true
  same_error_cooldown_hours: 6
  display_utc_offset_hours: 3   # বার্তার সময় সৌদি (Asia/Riyadh = UTC+3, কোনো DST নেই)

storage:
  state_file: state/signals.json   # লোকাল রান (gitignored)। Actions-এ --publish data দিলে data/state.json ও data ব্রাঞ্চে কমিট হয়
  public_last_price: false         # সিদ্ধান্ত: পাবলিক JSON-এ বর্তমান দাম নয় (Twelve Data শর্ত); শুধু সিগন্যালের দাম থাকে

heartbeat:                    # অচলতার সতর্কতা
  stale_after_hours: 3        # শেষ রানের পর এর বেশি বিরতি হলে পরের রানে সতর্কতা
  daily_utc_hour: 5           # প্রতিদিন এই UTC ঘণ্টার পর প্রথম রানে "সিস্টেম সচল" বার্তা (সৌদি ০৮:xx)। না এলে বুঝবেন cron বন্ধ

# ============================================================
# মার্কেট বায়াস (ধাপ ১ক)। শ্যাডো মোড: শুধু দেখায় ও লগ করে, সিগন্যাল ইঞ্জিনে কোনো প্রভাব নেই।
# সব ওজন/স্কেল আগে থেকে ঠিক করা। ফল দেখে টিউন করা নিষেধ। এটা ভবিষ্যদ্বাণী নয়, প্রেক্ষাপট-সূচক।
# ============================================================
bias:
  version: "bias-v1-shadow"
  pairs: [XAUUSD, EURUSD, GBPUSD, USDJPY, AUDUSD, USDCAD]
  full_fundamentals: [XAUUSD]       # পূর্ণ ফান্ডামেন্টাল শুধু গোল্ডে; বাকিতে চার্ট + ডলার-ফ্যাক্টর ("সীমিত")
  usd_sign:                         # ডলার শক্তিশালী হলে পেয়ার কোন দিকে (+১ = বাড়ে, −১ = কমে)
    XAUUSD: -1
    EURUSD: -1
    GBPUSD: -1
    AUDUSD: -1
    USDJPY: 1
    USDCAD: 1
  neutral_band: 0.25                # |স্কোর| এর নিচে হলে "নিরপেক্ষ"
  confidence_bands: [0.25, 0.45, 0.65]   # [0.25,0.45) কম, [0.45,0.65) মাঝারি, ≥0.65 বেশি
  min_weight_share: 0.5             # পাওয়া উপাদানের ওজন-ভাগ এর কম হলে "ডেটা অপর্যাপ্ত", নিরপেক্ষ
  range_k: 1.0                      # দামের সীমা = দাম ± range_k × (ATR × ঘণ্টার গুণক)
  level_reach: 1.5                  # নিকটতম সুইং লেভেল এই গুণ সীমার মধ্যে থাকলে "লক্ষ্য" ধরা হয়
  level_lookback: 120
  scales:                           # স্কোর ±১ ধরার একক
    trend_gap_atr: 1.0              # D1 EMA50−EMA200 ফারাক (ATR)
    trend_fast_atr: 0.75            # H4/H1 EMA20−EMA50 ফারাক (ATR)
    rsi_span: 20.0                  # (RSI−৫০)/এটি
    ema_pos_atr: 2.0                # (দাম−EMA20) ATR-এ
    change_obs: 5                   # FRED পরিবর্তন কত পর্যবেক্ষণে (দিন)
    real_yield_bp: 15.0             # রিয়েল ইয়িল্ড পরিবর্তন (bp)
    usd_pct: 1.0                    # ডলার ইনডেক্স পরিবর্তন (%)
    vix_pts: 3.0                    # VIX পরিবর্তন (পয়েন্ট)
    cot_oi_frac: 0.03               # ৪ সপ্তাহে নেট পজিশন পরিবর্তন ÷ ওপেন ইন্টারেস্ট
  min_reason_score: 0.15            # এর কম হলে কারণের তালিকায় নয়
  weights:
    h4: {trend_h1: 0.30, rsi_h1: 0.20, ema_pos_h1: 0.15, trend_h4: 0.20, trend_d1: 0.15}
    d1: {trend_d1: 0.25, trend_h4: 0.20, rsi_d1: 0.10, trend_h1: 0.10, real_yield: 0.15, usd: 0.15, vix: 0.05}
    w1: {trend_d1: 0.30, rsi_d1: 0.10, real_yield: 0.20, usd: 0.15, cot: 0.15, vix: 0.10}
  horizons:
    h4: {hours: 4,   range_frame: H1, range_mult: 2.0,   level_frame: H4}
    d1: {hours: 24,  range_frame: D1, range_mult: 1.0,   level_frame: H4}
    w1: {hours: 168, range_frame: D1, range_mult: 2.236, level_frame: D1}
  log:                              # স্বাধীন নমুনার জন্য প্রতিটি সময়সীমা নিজের পর্বে একবারই লগ হয়
    anchor_utc_hour: {h4: 0, d1: 20, w1: 20}     # w1: রবিবার এই ঘণ্টায় শুরু
    max_lag_hours: {h4: 1.5, d1: 4, w1: 12}   # পর্ব শুরুর এর বেশি পরে প্রথম রান হলে লগ নয়
    max_entries: 4000
    min_samples_for_judgement: 100
    closed_overlap_skip: 0.5        # মেয়াদের এতটা বাজার বন্ধ থাকলে লগ নয়
  sources:
    max_stale_days: {fred: 7, cot: 14, usd: 14}   # usd: Fed-এর ব্রড ডলার ইনডেক্স সাপ্তাহিক আপডেট হয়, তাই বেশি সময়
    fred:
      series: {real_yield: DFII10, usd: DTWEXBGS, vix: VIXCLS}
      lookback_days: 60
    cot:
      url: "https://publicreporting.cftc.gov/resource/72hh-3qpy.json"
      gold_code: "088691"
      rows: 8
    news:
      max_items: 12
      max_age_days: 4
      feeds:
        - {name: "Federal Reserve", url: "https://www.federalreserve.gov/feeds/press_all.xml"}
        - {name: "ECB", url: "https://www.ecb.europa.eu/rss/press.html"}
        - {name: "BLS", url: "https://www.bls.gov/feed/bls_latest.rss"}
    events:
      window_days: 7
      fred_releases:                 # FRED রিলিজ-নামের অংশ → আনুমানিক সময় (নিউ ইয়র্ক)
        "Consumer Price Index": {label: "US CPI", time_et: "08:30"}
        "Employment Situation": {label: "US Non-Farm Payrolls", time_et: "08:30"}
        "Gross Domestic Product": {label: "US GDP", time_et: "08:30"}
        "Personal Income and Outlays": {label: "US PCE", time_et: "08:30"}
        "Producer Price Index": {label: "US PPI", time_et: "08:30"}
        "Advance Monthly Sales for Retail": {label: "US Retail Sales", time_et: "08:30"}
        "Job Openings and Labor Turnover": {label: "US JOLTS", time_et: "10:00"}
      fomc_dates: ["2026-01-28", "2026-03-18", "2026-04-29", "2026-06-17", "2026-07-29", "2026-09-16", "2026-10-28", "2026-12-09"]
      fomc_time_et: "14:00"          # সিদ্ধান্তের দিন। Fed-এর অফিসিয়াল ক্যালেন্ডারের সাথে মিলিয়ে নিন; ২০২৭-এর তারিখ পরে যোগ করতে হবে
      levels:                        # ইভেন্টের গুরুত্ব: high = লাল, medium = কমলা
        high: [cpi, nfp, pce, fomc]
        medium: [ppi, gdp, retail, unemp, jolts]
      gold_effect:                   # আসল ফল ফোরকাস্টের চেয়ে বেশি হলে গোল্ড সাধারণত কোন দিকে (প্রাথমিক প্রতিক্রিয়ার প্রবণতা)
        cpi: down
        ppi: down
        pce: down
        nfp: down
        gdp: down
        retail: down
        jolts: down
        unemp: up
        fomc: down                   # কড়া সুর (হকিশ) = বেশি
      previous:                      # FRED থেকে সর্বশেষ প্রকাশিত মান (হেডলাইন)
        cpi: {id: CPIAUCSL, transform: yoy, unit: "%", label: "হেডলাইন CPI, বার্ষিক"}
        pce: {id: PCEPI, transform: yoy, unit: "%", label: "PCE মূল্যসূচক, বার্ষিক"}
        ppi: {id: PPIFIS, transform: yoy, unit: "%", label: "PPI (ফাইনাল ডিমান্ড), বার্ষিক"}
